<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>菜单编辑器</title>
  <script src="https://cdn.jsdelivr.net/npm/vue@2.7.14/dist/vue.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/element-ui@2.15.14/lib/index.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/element-ui@2.15.14/lib/theme-chalk/index.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background-color: #f7f8fa;
      font-size: 15px;
    }
    .header-wrap {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      background: #fff;
      position: sticky;
      top: 0;
      z-index: 99;
    }
    .header-title {
      font-size: 18px;
      font-weight: 600;
    }
    .menu-card {
      background: #fff;
      margin: 12px 16px;
      border-radius: 10px;
      padding: 16px;
    }
    .food-item {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid #eee;
    }
    .food-item:last-child {
      border-bottom: none;
    }
    .btn-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 10px;
    }
    .tab-container {
      margin: 0 16px;
      background: #fff;
      border-radius: 10px;
      overflow: hidden;
    }
    [v-cloak] {
      display: none !important;
    }
  </style>
</head>
<body>
<div id="app" v-cloak>
  <!-- 顶部导航 -->
  <div class="header-wrap">
    <div class="header-title">我的菜谱本</div>
    <el-button size="small" type="primary" @click="openShareModal">分享菜谱库</el-button>
  </div>

  <el-tabs v-model="activeTab" class="tab-container">
    <!-- 标签1：菜单编辑 -->
    <el-tab-pane label="菜单编辑" name="edit">
      <div class="menu-card">
        <h3>今日菜单</h3>
        <div class="food-item" v-for="(food, idx) in foodList" :key="idx">
          <span>{{food.name}}｜{{food.price}}元</span>
          <el-checkbox v-model="food.selected"></el-checkbox>
        </div>
        <div class="btn-group">
          <el-button size="small" @click="shareTodayMenu">今日菜单分享</el-button>
        </div>
      </div>
    </el-tab-pane>

    <!-- 标签2：我的（导入导出） -->
    <el-tab-pane label="我的" name="mine">
      <div class="menu-card">
        <el-button size="small" @click="exportJson">导出菜谱JSON</el-button>
        <el-button size="small" @click="triggerImport">导入菜谱JSON</el-button>
        <input ref="fileInput" type="file" accept=".json" style="display:none;" @change="handleImportFile"/>
      </div>
    </el-tab-pane>
  </el-tabs>

  <!-- 分享弹窗 -->
  <el-dialog title="分享菜单" v-model="shareModalVisible" width="90%">
    <p>把下面链接转发给好友，打开即可预览完整菜单界面</p>
    <el-input v-model="shareUrl" readonly></el-input>
    <div style="margin-top:12px;text-align:right;">
      <el-button @click="copyShareUrl">复制链接</el-button>
    </div>
    <p style="margin-top:10px;color:#888;font-size:13px;">
      提示：好友打开链接预览菜单后，可以【导出JSON】，再到自己本地页面导入
    </p>
  </el-dialog>
</div>

<script>
new Vue({
  el: '#app',
  data() {
    return {
      activeTab: 'edit',
      shareModalVisible: false,
      shareUrl: '',
      // 菜品示例数据
      foodList: [
        { name: '红烧肉', price: 38, selected: false },
        { name: '番茄炒蛋', price: 16, selected: false },
        { name: '清炒青菜', price: 12, selected: false },
        { name: '可乐鸡翅', price: 32, selected: false }
      ]
    }
  },
  mounted() {
    // 读取URL分享参数
    const urlParams = new URLSearchParams(window.location.search);
    const shareStr = urlParams.get('share');
    if(shareStr){
      try{
        const raw = decodeURIComponent(atob(shareStr));
        const shareData = JSON.parse(raw);
        this.foodList = shareData.foodList;
        this.$message.success("已加载分享的菜单！你可以修改后导出保存");
      }catch(e){
        console.error(e);
        this.$message.warning("分享数据解析失败");
      }
    }
  },
  methods: {
    // 打开分享弹窗、生成链接
    openShareModal(){
      const payload = {
        foodList: this.foodList
      };
      const jsonStr = JSON.stringify(payload);
      const encodeStr = btoa(encodeURIComponent(jsonStr));
      // 拼接分享链接
      const baseUrl = window.location.href.split('?')[0];
      this.shareUrl = `${baseUrl}?share=${encodeStr}`;
      this.shareModalVisible = true;
    },
    copyShareUrl(){
      navigator.clipboard.writeText(this.shareUrl).then(()=>{
        this.$message.success("链接复制成功！可以发送给好友");
      }).catch(()=>{
        this.$message.error("复制失败，请手动复制链接");
      })
    },
    // 今日菜单快捷分享（只分享已勾选菜品）
    shareTodayMenu(){
      const selected = this.foodList.filter(item=>item.selected);
      if(selected.length === 0){
        return this.$message.warning("请先勾选需要分享的菜品");
      }
      const payload = { foodList: selected };
      const encodeStr = btoa(encodeURIComponent(JSON.stringify(payload)));
      const baseUrl = window.location.href.split('?')[0];
      const link = `${baseUrl}?share=${encodeStr}`;
      const shareText = `【今日菜单分享】\n${selected.map(i=>i.name).join('、')}\n完整预览链接：${link}`;
      navigator.clipboard.writeText(shareText).then(()=>{
        this.$message.success("分享文案已复制，直接粘贴发送");
      })
    },
    // 导出JSON（移动端修复blob下载兼容）
    exportJson(){
      const dataStr = JSON.stringify(this.foodList,null,2);
      const blob = new Blob([dataStr], {type:'application/json'});
      const fileName = "我的菜单.json";
      // 兼容安卓、IOS移动端下载
      if(/Android|iPhone|iPad/i.test(navigator.userAgent)){
        const reader = new FileReader();
        reader.readAsDataURL(blob);
        reader.onload = ()=>{
          const a = document.createElement('a');
          a.href = reader.result;
          a.download = fileName;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
        }
      }else{
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = fileName;
        a.click();
        URL.revokeObjectURL(url);
      }
    },
    triggerImport(){
      this.$refs.fileInput.click();
    },
    handleImportFile(e){
      const file = e.target.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = (ev)=>{
        try{
          const data = JSON.parse(ev.target.result);
          this.foodList = data.foodList || data;
          this.$message.success("菜单导入成功！");
        }catch(err){
          this.$message.error("文件格式错误，导入失败");
        }
      }
      reader.readAsText(file);
      // 清空input，防止重复选择同一文件无响应
      e.target.value = null;
    }
  }
})
</script>
</body>
</html>
